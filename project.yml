name: WhyApp

options:
  bundleIdPrefix: com.whynot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""  # ← Fill in your Apple Team ID

targets:

  WhyApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhyApp/App
      - path: WhyApp/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whynot.WhyApp
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: WhyApp/WhyApp.entitlements
    dependencies:
      - target: WhyNotShieldConfiguration
        embed: true
      - target: WhyNotShieldAction
        embed: true
    info:
      path: WhyApp/App/Info.plist
      properties:
        CFBundleDisplayName: WhyApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  WhyNotShieldConfiguration:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhyApp/ShieldConfiguration
      - path: WhyApp/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whynot.WhyApp.ShieldConfiguration
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    entitlements:
      path: WhyApp/ShieldConfiguration/ShieldConfiguration.entitlements
    info:
      path: WhyApp/ShieldConfiguration/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.screentime.shield.configuration
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).WhyNotShieldConfiguration

  WhyNotShieldAction:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WhyApp/ShieldAction
      - path: WhyApp/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.whynot.WhyApp.ShieldAction
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - sdk: ManagedSettingsUI.framework
    entitlements:
      path: WhyApp/ShieldAction/ShieldAction.entitlements
    info:
      path: WhyApp/ShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.screentime.shield.action
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).WhyNotShieldAction

schemes:
  WhyApp:
    build:
      targets:
        WhyApp: all
        WhyNotShieldConfiguration: all
        WhyNotShieldAction: all
    run:
      config: Debug
      executable: WhyApp
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
